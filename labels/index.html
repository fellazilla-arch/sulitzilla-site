<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sulitzilla Label Print</title>
  <link rel="stylesheet" href="./widget/widget.css" />
  <link rel="stylesheet" href="./print-app.css" />
  <script src="./vendor/niimbluelib.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">Sulitzilla Labels</div>
      <div class="actions">
        <button type="button" id="btn-parse" class="btn">Load paste</button>
        <button type="button" id="btn-connect-usb" class="btn">Connect USB</button>
        <button type="button" id="btn-connect-bt" class="btn">Connect Bluetooth</button>
        <button type="button" id="btn-disconnect" class="btn" disabled>Disconnect</button>
        <button type="button" id="btn-print" class="btn btn-primary" disabled>Print Labels</button>
        <button type="button" id="btn-reprint" class="btn" disabled>Reprint Last</button>
        <button type="button" id="btn-clear" class="btn btn-ghost">Clear</button>
      </div>
    </header>

    <section class="status-bar" aria-live="polite">
      <span id="status-selection">Paste rows from Grist, then Load paste</span>
      <span class="sep">·</span>
      <span id="status-printer">Printer: disconnected</span>
    </section>

    <section class="settings">
      <label>Printer
        <select id="opt-engine">
          <option value="xprinter" selected>Xprinter (TSPL)</option>
          <option value="niimbot">NIIMBOT</option>
        </select>
      </label>
      <label>W <input type="number" id="opt-width" min="20" max="120" step="1" value="50" /> mm</label>
      <label>H <input type="number" id="opt-height" min="10" max="150" step="1" value="30" /> mm</label>
      <label>Gap <input type="number" id="opt-gap" min="0" max="10" step="0.5" value="2" /> mm</label>
      <label title="Positive moves print right on the label">Offset X <input type="number" id="opt-offset-x" min="-20" max="20" step="0.5" value="0" /> mm</label>
      <label title="Positive moves print down on the label">Offset Y <input type="number" id="opt-offset-y" min="-20" max="20" step="0.5" value="0" /> mm</label>
      <label title="Code text size">Code <input type="number" id="opt-font-code" min="50" max="160" step="5" value="100" />%</label>
      <label title="Brand / product text size (long names wrap)">Product <input type="number" id="opt-font-product" min="50" max="160" step="5" value="115" />%</label>
      <label title="Count / size text size">Count <input type="number" id="opt-font-count" min="50" max="160" step="5" value="100" />%</label>
    </section>

    <section class="message" id="message" hidden></section>

    <section class="paste-panel">
      <label class="paste-label" for="paste-input">
        Paste from Kango Arrived, Amazon Arrived, or Taobao Arrived. Prefer <strong>Connect USB</strong> for Xprinter (close Open Label+ / other apps using the port first). Match W×H to your loaded labels.
      </label>
      <textarea
        id="paste-input"
        spellcheck="false"
        placeholder="Paste any view… headers optional."
      ></textarea>

      <div class="field-status" id="field-status" hidden></div>

      <div class="map-row" id="map-row" hidden>
        <span class="map-title">Adjust map</span>
        <label>Code <select id="map-code"></select></label>
        <label>Brand <select id="map-brand"></select></label>
        <label>Product <select id="map-product"></select></label>
        <label>Variation <select id="map-variation"></select></label>
        <label>Count/Size <select id="map-count"></select></label>
      </div>
    </section>

    <section class="preview-meta" id="preview-meta"></section>
    <section class="preview-list" id="preview-list"></section>
  </div>

  <script type="module" src="./print-app.js"></script>
</body>
</html>
